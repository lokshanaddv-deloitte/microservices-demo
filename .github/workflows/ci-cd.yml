
name: Online Boutique AWS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "063570951089"
  ECR_REPOSITORY: online-boutique

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Diagnose GitHub OIDC identity
      - name: Check GitHub OIDC Subject
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`OIDC audience: ${payload.aud}`);
            core.info(`Repository ID: ${payload.repository_id}`);
            core.info(`Owner ID: ${payload.repository_owner_id}`);

      # Step 3: Authenticate with AWS
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 4: Verify AWS authentication
      - name: Verify AWS identity
        if: github.event_name == 'push'
        run: |
          aws sts get-caller-identity

      # Step 5: Login to Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 6: Build and push Docker images
      - name: Build and push microservice images
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          services=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for service in "${services[@]}"; do

            echo "=================================="
            echo "Building $service"
            echo "=================================="

            docker build \
              -t "$ECR_REGISTRY/$ECR_REPOSITORY:$service-$IMAGE_TAG" \
              "./src/$service"

            echo "Pushing $service to ECR"

            docker push \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$service-$IMAGE_TAG"

            echo "$service pushed successfully"

          done

      # Step 7: Completion message
      - name: Pipeline completed
        if: success() && github.event_name == 'push'
        run: |
          echo "Online Boutique CI/CD pipeline completed!"
          echo "Docker images pushed to AWS ECR."
