
name: Online Boutique AWS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "063570951089"
  ECR_REPOSITORY: online-boutique

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub OIDC Subject
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`OIDC audience: ${payload.aud}`);
            core.info(`Repository ID: ${payload.repository_id}`);
            core.info(`Owner ID: ${payload.repository_owner_id}`);

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        if: github.event_name == 'push'
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push microservice images
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          services=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )

          for service in "${services[@]}"; do

            echo "=================================="
            echo "Building $service"
            echo "=================================="

            # Set the correct build context
            if [[ "$service" == "cartservice" ]]; then
              BUILD_CONTEXT="./src/cartservice/src"
            else
              BUILD_CONTEXT="./src/$service"
            fi

            DOCKERFILE="$BUILD_CONTEXT/Dockerfile"
            IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$service-$IMAGE_TAG"

            # Check build context
            if [[ ! -d "$BUILD_CONTEXT" ]]; then
              echo "ERROR: Build context not found: $BUILD_CONTEXT"
              exit 1
            fi

            # Check Dockerfile
            if [[ ! -f "$DOCKERFILE" ]]; then
              echo "ERROR: Dockerfile not found: $DOCKERFILE"
              echo "Files available:"
              ls -la "$BUILD_CONTEXT"
              exit 1
            fi

            echo "Using Dockerfile: $DOCKERFILE"
            echo "Using build context: $BUILD_CONTEXT"

            # Build Docker image
            docker build \
              -f "$DOCKERFILE" \
              -t "$IMAGE" \
              "$BUILD_CONTEXT"

            # Push Docker image
            echo "Pushing $service to ECR"
            docker push "$IMAGE"

            echo "$service pushed successfully"

          done

      - name: Pipeline completed
        if: success() && github.event_name == 'push'
        run: |
          echo "Online Boutique CI/CD pipeline completed!"
          echo "All Docker images pushed to AWS ECR."
